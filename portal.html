<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeCastro | Criador de Cursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A44; --ink-soft:#3D4E6B;
    --parchment:#F3ECDD; --parchment-2:#EAE1CC;
    --ochre:#B98029; --ochre-dark:#8A5E1B; --ochre-light:#D9A64F;
    --forest:#3F5D4F; --forest-light:#EDF1EC;
    --line:#D8CFB8; --danger:#A32D2D;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--parchment); color:var(--ink); font-family:'Source Sans 3', sans-serif; -webkit-font-smoothing:antialiased; }

  .cover{ display:grid; grid-template-columns:1fr 1fr; min-height:100vh; }
  @media (max-width:860px){ .cover{ grid-template-columns:1fr; } .cover-visual{ min-height:280px; } }

  .cover-content{ display:flex; flex-direction:column; justify-content:center; padding:4rem clamp(1.75rem, 6vw, 5rem); }
  .cover-brand{ font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; margin-bottom:2.5rem; }
  .cover-brand span{ color:var(--ochre-dark); }
  .cover-title{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(2.1rem, 4vw, 3.1rem); line-height:1.12; margin:0 0 1.1rem; max-width:14ch; }
  .cover-sub{ color:var(--ink-soft); font-size:1.08rem; line-height:1.6; max-width:42ch; margin:0 0 2.6rem; }
  .cover-form-wrap{ max-width:360px; }

  .cover-visual{ position:relative; background:var(--ink); overflow:hidden; }
  .cover-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  .cover-caption{ position:absolute; z-index:2; bottom:2.5rem; left:2.5rem; right:2.5rem; color:var(--parchment-2); font-family:'Fraunces', serif; font-style:italic; font-size:1rem; line-height:1.5; max-width:34ch; text-shadow:0 1px 5px rgba(0,0,0,0.6); }

  .field{margin-bottom:1.2rem;}
  .field label{ display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.4rem; }
  input[type=text], input[type=password]{ width:100%; font-family:'Source Sans 3', sans-serif; font-size:0.95rem; padding:0.65rem 0.75rem; border:1px solid var(--line); border-radius:3px; background:#fff; color:var(--ink); }
  input:focus{ outline:none; border-color:var(--ochre); }
  .btn{ font-family:'Source Sans 3', sans-serif; font-size:0.95rem; font-weight:600; padding:0.75rem 1.3rem; border-radius:3px; cursor:pointer; border:1px solid var(--ink); width:100%; }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}
  .link-btn{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; font-size:0.85rem; padding:0; margin-top:0.9rem; }
  .error-text{ color:var(--danger); font-size:0.85rem; margin-top:0.6rem; }
  .form-actions{ display:flex; flex-direction:column; gap:0.7rem; margin-top:1.3rem; }

  .choices{ display:flex; flex-direction:column; gap:1rem; max-width:460px; }
  .choice-card{ display:flex; gap:1.1rem; align-items:flex-start; text-decoration:none; border:1px solid var(--line); border-radius:4px; padding:1.4rem 1.5rem; background:#fff; transition:border-color 0.15s; }
  .choice-card:hover{ border-color:var(--ochre); }
  .choice-icon{ flex-shrink:0; width:2.4rem; height:2.4rem; }
  .choice-card h3{ font-family:'Fraunces', serif; font-weight:600; font-size:1.15rem; margin:0 0 0.3rem; color:var(--ink); }
  .choice-card p{ margin:0; color:var(--ink-soft); font-size:0.92rem; line-height:1.45; }
  .top-account{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:2rem; }
  .top-account button{ background:none; border:1px solid var(--line); padding:0.35rem 0.8rem; border-radius:3px; cursor:pointer; margin-left:0.6rem; }
</style>
</head>

<script>
const WORKER_BASE_URL = 'https://criador-curso-decastro.intelectus247.workers.dev';
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
async function fetchWorker(path, { method, body } = {}){
  const opts = { method: method || 'GET', credentials: 'include', headers: { 'content-type': 'application/json' } };
  if(body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(WORKER_BASE_URL + path, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('resposta ' + res.status));
  return data;
}

let currentUser = null;
async function refreshUser(){
  try{ currentUser = await fetchWorker('/api/me'); }
  catch(e){ currentUser = { authenticated:false }; }
}

function renderApp(html){ document.getElementById('app').innerHTML = html; }

      </div>
    </div>`);
  document.getElementById('loginBtn').onclick = async ()=>{
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    if(!email || !pass) return;
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try{
      await fetchWorker('/api/login', { method:'POST', body:{ email, password: pass } });
      await refreshUser();
      render();
    }catch(err){
      const el = document.getElementById('err');
      el.style.display='block'; el.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
  document.getElementById('signupBtn').onclick = screenSignup;
}

function screenSignup(){
  renderApp(`
    <h1 class="cover-title">Comece a criar em minutos.</h1>
    <p class="cover-sub">Uma conta gratuita já deixa você experimentar a IA montando um curso pequeno — assine quando quiser ir além.</p>
    <div class="cover-form-wrap">
      <div class="field"><label>Nome</label><input type="text" id="name"></div>
      <div class="field"><label>E-mail</label><input type="text" id="email"></div>
      <div class="field" style="margin-bottom:0;"><label>Senha</label><input type="password" id="pass"></div>
      <p class="error-text" id="err" style="display:none;"></p>
      <div class="form-actions">
        <button class="btn btn-primary" id="signupBtn2">Criar conta</button>
        <button class="btn btn-ghost" id="backLogin">Já tenho conta</button>
      </div>
    </div>`);
  document.getElementById('signupBtn2').onclick = async ()=>{
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    if(!name || !email || !pass) return;
    const btn = document.getElementById('signupBtn2');
    btn.disabled = true; btn.textContent = 'Criando conta...';
    try{
      await fetchWorker('/api/signup', { method:'POST', body:{ name, email, password: pass } });
      await refreshUser();
      render();
    }catch(err){
      const el = document.getElementById('err');
      el.style.display='block'; el.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Criar conta';
    }
  };
  document.getElementById('backLogin').onclick = screenLogin;
}

function screenChoice(){
  renderApp(`
    <div class="top-account">Olá, ${escapeHtml(currentUser.name)}<button id="logoutBtn">Sair</button></div>
    <h1 class="cover-title" style="max-width:16ch;">O que você vai fazer hoje?</h1>
    <div class="choices">
      <a class="choice-card" href="criador-de-curso.html">
        <svg class="choice-icon" viewBox="0 0 40 40" fill="none"><rect x="6" y="8" width="28" height="24" rx="2" stroke="#B98029" stroke-width="1.6"/><path d="M12 16h16M12 22h16M12 28h10" stroke="#1B2A44" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div><h3>Sou professor</h3><p>Criar, editar e gerenciar meus cursos.</p></div>
      </a>
      <a class="choice-card" href="area-aluno.html">
        <svg class="choice-icon" viewBox="0 0 40 40" fill="none"><path d="M20 8 L36 15 L20 22 L4 15 Z" stroke="#B98029" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 18v9c0 2.5 4 5 9 5s9-2.5 9-5v-9" stroke="#1B2A44" stroke-width="1.6"/></svg>
        <div><h3>Sou aluno</h3><p>Acessar meu curso / Me inscrever em um novo curso.</p></div>
      </a>
    </div>
  `);
  document.getElementById('logoutBtn').onclick = async ()=>{
    await fetchWorker('/api/logout', { method:'POST', body:{} }).catch(()=>{});
    await refreshUser();
    render();
  };
}

async function render(){
  if(currentUser && currentUser.authenticated) screenChoice();
  else screenLogin();
}

async function init(){
  await refreshUser();
  render();
}
init();
</script>
