<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Aluno | DeCastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A44; --ink-soft:#3D4E6B;
    --parchment:#F3ECDD; --parchment-2:#EAE1CC;
    --ochre:#B98029; --ochre-dark:#8A5E1B;
    --forest:#3F5D4F; --forest-light:#EDF1EC;
    --line:#D8CFB8; --danger:#A32D2D;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--parchment); color:var(--ink); font-family:'Source Sans 3', sans-serif; -webkit-font-smoothing:antialiased; }
  .shell{ max-width:820px; margin:0 auto; padding:2.5rem 1.5rem 5rem; }
  header.top{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:1.25rem; margin-bottom:1.25rem; }
  header.top .brand{ font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; }
  header.top .brand span{color:var(--ochre-dark);}
  .account-bar{ display:flex; justify-content:flex-end; align-items:center; gap:0.75rem; font-size:0.82rem; color:var(--ink-soft); margin-bottom:1.5rem; }
  .account-bar button{ background:none; border:1px solid var(--line); color:var(--ink); padding:0.3rem 0.7rem; border-radius:3px; font-size:0.78rem; cursor:pointer; }
  h1.page-title{ font-family:'Fraunces', serif; font-weight:500; font-size:1.9rem; line-height:1.25; margin:0 0 0.5rem; }
  p.page-sub{ color:var(--ink-soft); font-size:1rem; margin:0 0 2rem; max-width:56ch; }
  .panel{ background:#fff; border:1px solid var(--line); border-radius:4px; padding:2rem; }
  .field{margin-bottom:1.4rem;}
  .field label{ display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.4rem; }
  input[type=text], input[type=password]{ width:100%; font-family:'Source Sans 3', sans-serif; font-size:0.95rem; padding:0.6rem 0.7rem; border:1px solid var(--line); border-radius:3px; background:var(--parchment); color:var(--ink); }
  input:focus{ outline:none; border-color:var(--ochre); background:#fff; }
  .btn{ font-family:'Source Sans 3', sans-serif; font-size:0.92rem; font-weight:600; padding:0.65rem 1.3rem; border-radius:3px; cursor:pointer; border:1px solid var(--ink); }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}
  .btn[disabled]{opacity:0.5; cursor:not-allowed;}
  .error-text{ color:var(--danger); font-size:0.85rem; margin-top:0.6rem; }
  .layout{ display:grid; grid-template-columns:220px 1fr; gap:2.5rem; }
  @media (max-width:700px){ .layout{grid-template-columns:1fr;} }
  .lesson-list{list-style:none; margin:0; padding:0;}
  .lesson-list li{ padding:0.6rem 0; border-left:2px solid var(--line); padding-left:1rem; cursor:pointer; font-size:0.9rem; }
  .lesson-list li.active{border-left:2px solid var(--ochre); color:var(--ochre-dark); font-weight:600;}
  .lesson-list li.done{border-left:2px solid var(--forest);}
  .lesson-list li.done::after{content:" ✓"; color:var(--forest);}
  .module-heading{ font-family:'Fraunces', serif; font-weight:600; font-size:0.9rem; color:var(--ink-soft); margin:1rem 0 0.3rem; text-transform:uppercase; letter-spacing:0.03em; }
  .lesson-content{ white-space:pre-wrap; line-height:1.6; font-size:0.96rem; }
  .progress-bar{ height:6px; background:var(--parchment-2); border-radius:3px; overflow:hidden; margin-bottom:1.5rem; }
  .progress-bar-fill{ height:100%; background:var(--forest); }
  .question-block{ margin-bottom:1.8rem; padding-bottom:1.8rem; border-bottom:1px solid var(--line); }
  .question-block:last-child{border-bottom:none;}
  .question-block p.q-title{ font-weight:600; margin:0 0 0.8rem; }
  .option-row{ display:flex; align-items:center; gap:0.6rem; padding:0.4rem 0; cursor:pointer; }
  .option-row input{ width:auto; }
  .certificate-box{ border:3px double var(--ochre); border-radius:4px; padding:2.5rem 2rem; text-align:center; }
  .certificate-box h2{ font-family:'Fraunces', serif; font-size:1.6rem; margin:0 0 1rem; color:var(--ochre-dark); }
  .certificate-box p{ font-size:1.05rem; line-height:1.7; }
  .result-banner{ padding:1rem 1.2rem; border-radius:3px; margin-bottom:1.5rem; font-size:0.95rem; }
  .result-banner.pass{ background:var(--forest-light); border:1px solid var(--forest); color:var(--forest); }
  .result-banner.fail{ background:#FBEAEA; border:1px solid var(--danger); color:var(--danger); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">DeCastro <span>| Área do Aluno</span></div>
  </header>
  <div class="account-bar" id="accountBar"></div>
  <div id="app"></div>
</div>
<div id="modalRoot"></div>

<script>
const WORKER_BASE_URL = 'https://criador-curso-decastro.intelectus247.workers.dev';

function getCourseIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get('course');
}
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function fetchWorker(path, { method, body } = {}){
  const opts = { method: method || 'GET', credentials: 'include', headers: { 'content-type': 'application/json' } };
  if(body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(WORKER_BASE_URL + path, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('resposta ' + res.status));
  return data;
}

let currentUser = null;
let courseId = getCourseIdFromUrl();
let courseData = null;   // curso + enrollment (depois de inscrito)
let selectedLessonId = null;
let assessmentData = null;
let selectedAnswers = {};

async function refreshUser(){
  try{ currentUser = await fetchWorker('/api/me'); }
  catch(e){ currentUser = { authenticated:false }; }
}

function renderAccountBar(){
  const bar = document.getElementById('accountBar');
  if(currentUser && currentUser.authenticated){
    bar.innerHTML = `<span>Olá, ${escapeHtml(currentUser.name)}</span> <button id="logoutBtn">Sair</button>`;
    document.getElementById('logoutBtn').onclick = async ()=>{
      await fetchWorker('/api/logout', { method:'POST', body:{} }).catch(()=>{});
      await refreshUser();
      render();
    };
  } else {
    bar.innerHTML = `<button id="loginBtnTop">Entrar</button> <button id="signupBtnTop">Criar conta</button>`;
    document.getElementById('signupBtnTop').onclick = openSignupModal;
    document.getElementById('loginBtnTop').onclick = openLoginModal;
  }
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function openSignupModal(){
  document.getElementById('modalRoot').innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(27,42,68,0.55);display:flex;align-items:center;justify-content:center;padding:1.5rem;z-index:100;">
      <div style="background:#fff;border-radius:5px;max-width:420px;width:100%;padding:2rem;">
        <h3 style="font-family:'Fraunces',serif;margin:0 0 0.8rem;">Criar conta de aluno</h3>
        <div class="field"><label>Nome</label><input type="text" id="su-name"></div>
        <div class="field"><label>E-mail</label><input type="text" id="su-email"></div>
        <div class="field" style="margin-bottom:0;"><label>Senha</label><input type="password" id="su-pass"></div>
        <p class="error-text" id="suErr" style="display:none;"></p>
        <div style="margin-top:1.2rem; display:flex; flex-direction:column; gap:0.6rem;">
          <button class="btn btn-primary" id="doSignup">Criar conta</button>
          <button class="btn btn-ghost" id="closeSu">Cancelar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('doSignup').onclick = async ()=>{
    const name = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-pass').value;
    if(!name || !email || !password) return;
    try{
      await fetchWorker('/api/signup', { method:'POST', body:{ name, email, password } });
      await refreshUser();
      closeModal();
      render();
    }catch(err){
      const el = document.getElementById('suErr');
      el.style.display='block'; el.textContent = err.message;
    }
  };
  document.getElementById('closeSu').onclick = closeModal;
}

function openLoginModal(){
  document.getElementById('modalRoot').innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(27,42,68,0.55);display:flex;align-items:center;justify-content:center;padding:1.5rem;z-index:100;">
      <div style="background:#fff;border-radius:5px;max-width:420px;width:100%;padding:2rem;">
        <h3 style="font-family:'Fraunces',serif;margin:0 0 0.8rem;">Entrar</h3>
        <div class="field"><label>E-mail</label><input type="text" id="li-email"></div>
        <div class="field" style="margin-bottom:0;"><label>Senha</label><input type="password" id="li-pass"></div>
        <p class="error-text" id="liErr" style="display:none;"></p>
        <div style="margin-top:1.2rem; display:flex; flex-direction:column; gap:0.6rem;">
          <button class="btn btn-primary" id="doLogin">Entrar</button>
          <button class="btn btn-ghost" id="closeLi">Cancelar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('doLogin').onclick = async ()=>{
    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-pass').value;
    if(!email || !password) return;
    try{
      await fetchWorker('/api/login', { method:'POST', body:{ email, password } });
      await refreshUser();
      closeModal();
      render();
    }catch(err){
      const el = document.getElementById('liErr');
      el.style.display='block'; el.textContent = err.message;
    }
  };
  document.getElementById('closeLi').onclick = closeModal;
}

/* ---------- telas ---------- */

function renderApp(html){ document.getElementById('app').innerHTML = html; }

async function screenNoCourseId(){
  renderApp(`<div class="panel"><h1 class="page-title" style="font-size:1.3rem;">Nenhum curso indicado</h1>
    <p class="page-sub">Abra esta página a partir do link de um curso específico (ex: area-aluno.html?course=ID_DO_CURSO).</p></div>`);
}

async function screenNeedsLogin(){
  renderApp(`
    <div class="panel">
      <h1 class="page-title">Inscreva-se para começar</h1>
      <p class="page-sub">Crie uma conta gratuita (ou entre, se já tiver uma) para se inscrever neste curso e acompanhar seu progresso.</p>
      <div style="display:flex; gap:0.8rem;">
        <button class="btn btn-primary" id="goSignup">Criar conta</button>
        <button class="btn btn-ghost" id="goLogin">Já tenho conta</button>
      </div>
    </div>`);
  document.getElementById('goSignup').onclick = openSignupModal;
  document.getElementById('goLogin').onclick = openLoginModal;
}

async function screenEnroll(){
  renderApp(`
    <div class="panel">
      <h1 class="page-title">Pronto para começar?</h1>
      <p class="page-sub">Ao se inscrever, o curso passa a aparecer aqui com seu progresso salvo — você pode sair e voltar quando quiser.</p>
      <button class="btn btn-primary" id="enrollBtn">Inscrever-se no curso</button>
      <p class="error-text" id="enrollErr" style="display:none;"></p>
    </div>`);
  document.getElementById('enrollBtn').onclick = async ()=>{
    const btn = document.getElementById('enrollBtn');
    btn.disabled = true; btn.textContent = 'Inscrevendo...';
    try{
      await fetchWorker('/api/enroll', { method:'POST', body:{ courseId } });
      await loadCourseData();
      render();
    }catch(err){
      const el = document.getElementById('enrollErr');
      el.style.display='block'; el.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Inscrever-se no curso';
    }
  };
}

async function loadCourseData(){
  courseData = await fetchWorker('/api/course-for-student?courseId=' + encodeURIComponent(courseId));
  if(!selectedLessonId){
    const firstModule = courseData.modules[0];
    if(firstModule && firstModule.lessons[0]) selectedLessonId = firstModule.lessons[0].id;
  }
}

function allLessons(){
  const list = [];
  courseData.modules.forEach(m=>m.lessons.forEach(l=>list.push({ ...l, moduleTitle:m.title })));
  return list;
}

async function screenLessons(){
  const completed = courseData.enrollment.completed_lessons || [];
  const lessons = allLessons();
  const totalCount = lessons.length;
  const doneCount = lessons.filter(l=>completed.includes(l.id)).length;
  const allDone = doneCount === totalCount;
  const lesson = lessons.find(l=>l.id === selectedLessonId) || lessons[0];

  let railHtml = '';
  courseData.modules.forEach(m=>{
    railHtml += `<div class="module-heading">${escapeHtml(m.title)}</div><ul class="lesson-list">`;
    m.lessons.forEach(l=>{
      const cls = (l.id === selectedLessonId ? 'active ' : '') + (completed.includes(l.id) ? 'done' : '');
      railHtml += `<li class="${cls}" data-lid="${l.id}">${escapeHtml(l.title)}</li>`;
    });
    railHtml += `</ul>`;
  });

  renderApp(`
    <div style="display:flex; justify-content:flex-end; margin-bottom:0.8rem;">
      <a href="${WORKER_BASE_URL}/api/apostila?courseId=${encodeURIComponent(courseId)}" target="_blank" style="font-size:0.85rem;">📄 Baixar apostila em PDF</a>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" style="width:${totalCount ? (doneCount/totalCount*100) : 0}%;"></div></div>
    <p style="font-size:0.85rem; color:var(--ink-soft); margin:-1rem 0 1.5rem;">${doneCount} de ${totalCount} aulas concluídas</p>
    <div class="layout">
      <div>${railHtml}</div>
      <div class="panel">
        <p style="font-size:0.8rem; color:var(--ink-soft); margin:0 0 0.3rem;">${escapeHtml(lesson.moduleTitle)}</p>
        <h2 style="font-family:'Fraunces',serif; font-weight:600; margin:0 0 1rem;">${escapeHtml(lesson.title)}</h2>
        ${lesson.videoUrl ? `<p style="margin-bottom:1rem;"><a href="${escapeHtml(lesson.videoUrl)}" target="_blank">🎬 Assistir vídeo desta aula</a></p>` : ''}
        <div class="lesson-content">${escapeHtml(lesson.content)}</div>
        <div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.85rem; color:var(--ink-soft);">${completed.includes(lesson.id) ? 'Aula concluída ✓' : ''}</span>
          <div style="display:flex; gap:0.6rem;">
            ${!completed.includes(lesson.id) ? '<button class="btn btn-primary" id="completeBtn">Marcar como concluída</button>' : ''}
            ${allDone ? '<button class="btn btn-primary" id="goAssessmentBtn">Fazer avaliação final</button>' : ''}
          </div>
        </div>
      </div>
    </div>`);

  document.querySelectorAll('.lesson-list li').forEach(li=>{
    li.onclick = ()=>{ selectedLessonId = li.dataset.lid; render(); };
  });
  const completeBtn = document.getElementById('completeBtn');
  if(completeBtn){
    completeBtn.onclick = async ()=>{
      completeBtn.disabled = true; completeBtn.textContent = 'Salvando...';
      await fetchWorker('/api/complete-lesson', { method:'POST', body:{ courseId, lessonId: lesson.id } });
      await loadCourseData();
      render();
    };
  }
  const goAssessmentBtn = document.getElementById('goAssessmentBtn');
  if(goAssessmentBtn) goAssessmentBtn.onclick = ()=>{ appScreen = 'assessment'; render(); };
}

async function screenAssessment(){
  renderApp(`<div class="panel"><p>Preparando sua avaliação final...</p></div>`);
  try{
    if(!assessmentData) assessmentData = await fetchWorker('/api/get-assessment?courseId=' + encodeURIComponent(courseId));
  }catch(err){
    renderApp(`<div class="panel"><p class="error-text">${escapeHtml(err.message)}</p></div>`);
    return;
  }

  let html = `<div class="panel"><h1 class="page-title" style="font-size:1.4rem;">Avaliação final</h1>
    <p class="page-sub">Responda todas as questões e envie ao final.</p>`;
  assessmentData.questions.forEach((q, qi)=>{
    html += `<div class="question-block"><p class="q-title">${qi+1}. ${escapeHtml(q.question)}</p>`;
    q.options.forEach((opt, oi)=>{
      const checked = selectedAnswers[qi] === oi ? 'checked' : '';
      html += `<label class="option-row"><input type="radio" name="q${qi}" value="${oi}" ${checked} data-qi="${qi}" data-oi="${oi}"> ${escapeHtml(opt)}</label>`;
    });
    html += `</div>`;
  });
  html += `<button class="btn btn-primary" id="submitAssessmentBtn">Enviar avaliação</button>
    <p class="error-text" id="assessErr" style="display:none;"></p></div>`;
  renderApp(html);

  document.querySelectorAll('.option-row input').forEach(inp=>{
    inp.addEventListener('change', e=>{ selectedAnswers[e.target.dataset.qi] = parseInt(e.target.dataset.oi); });
  });
  document.getElementById('submitAssessmentBtn').onclick = async ()=>{
    const answers = assessmentData.questions.map((_, qi)=> selectedAnswers[qi] !== undefined ? selectedAnswers[qi] : -1);
    if(answers.includes(-1)){
      const el = document.getElementById('assessErr');
      el.style.display='block'; el.textContent = 'Responda todas as perguntas antes de enviar.';
      return;
    }
    const btn = document.getElementById('submitAssessmentBtn');
    btn.disabled = true; btn.textContent = 'Enviando...';
    const result = await fetchWorker('/api/submit-assessment', { method:'POST', body:{ courseId, answers } });
    lastResult = result;
    appScreen = 'result';
    render();
  };
}

let appScreen = 'lessons';
let lastResult = null;

async function screenResult(){
  const passClass = lastResult.passed ? 'pass' : 'fail';
  const passText = lastResult.passed
    ? `Aprovado! Você acertou ${lastResult.correct} de ${lastResult.total} questões (${lastResult.score}%).`
    : `Você acertou ${lastResult.correct} de ${lastResult.total} questões (${lastResult.score}%) — abaixo da nota mínima. Revise as aulas e tente novamente.`;
  renderApp(`<div class="panel">
    <div class="result-banner ${passClass}">${passText}</div>
    ${lastResult.passed ? '<button class="btn btn-primary" id="getCertBtn">Ver certificado</button>' : '<button class="btn btn-ghost" id="backLessonsBtn">Voltar às aulas</button>'}
  </div>`);
  const certBtn = document.getElementById('getCertBtn');
  if(certBtn) certBtn.onclick = ()=>{ appScreen = 'certificate'; render(); };
  const backBtn = document.getElementById('backLessonsBtn');
  if(backBtn) backBtn.onclick = ()=>{ appScreen = 'lessons'; render(); };
}

async function screenCertificate(){
  renderApp(`<div class="panel"><p>Emitindo certificado...</p></div>`);
  const cert = await fetchWorker('/api/certificate?courseId=' + encodeURIComponent(courseId));
  renderApp(`<div class="panel">
    <div class="certificate-box">
      <h2>${escapeHtml(cert.title)}</h2>
      <p>${escapeHtml(cert.text)}</p>
    </div>
    <p style="text-align:center; margin-top:1.5rem;"><button class="btn btn-ghost" onclick="window.print()">Imprimir / salvar como PDF</button></p>
  </div>`);
}

/* ---------- render principal ---------- */
async function render(){
  closeModal();
  renderAccountBar();

  if(!courseId){ await screenNoCourseId(); return; }
  if(!currentUser.authenticated){ await screenNeedsLogin(); return; }
  if(!courseData){
    try{ await loadCourseData(); }
    catch(e){ await screenEnroll(); return; }
  }

  if(appScreen === 'assessment') await screenAssessment();
  else if(appScreen === 'result') await screenResult();
  else if(appScreen === 'certificate') await screenCertificate();
  else await screenLessons();
}

async function init(){
  await refreshUser();
  render();
}
init();
</script>
</body>
</html>
