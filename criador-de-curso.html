<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criador de Curso | DeCastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A44; --ink-soft:#3D4E6B;
    --parchment:#F3ECDD; --parchment-2:#EAE1CC;
    --ochre:#B98029; --ochre-dark:#8A5E1B;
    --forest:#3F5D4F; --forest-light:#EDF1EC;
    --line:#D8CFB8; --danger:#A32D2D;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--parchment); color:var(--ink); font-family:'Source Sans 3', sans-serif; -webkit-font-smoothing:antialiased; }
  .shell{ max-width:920px; margin:0 auto; padding:2.5rem 1.5rem 5rem; }
  header.top{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:1.25rem; margin-bottom:1.25rem; }
  header.top .brand{ font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; }
  header.top .brand span{color:var(--ochre-dark);}
  header.top .resume-note{ font-size:0.8rem; color:var(--ink-soft); }
  h1.page-title{ font-family:'Fraunces', serif; font-weight:500; font-size:2.1rem; line-height:1.25; margin:0 0 0.5rem; }
  p.page-sub{ color:var(--ink-soft); font-size:1rem; margin:0 0 2rem; max-width:56ch; }
  .layout{ display:grid; grid-template-columns:200px 1fr; gap:3rem; }
  @media (max-width:720px){ .layout{grid-template-columns:1fr;} }
  .steps-rail{list-style:none;margin:0;padding:0;}
  .steps-rail li{ display:flex; gap:0.75rem; padding:0.6rem 0; border-left:2px solid var(--line); padding-left:1rem; cursor:pointer; }
  .steps-rail li.active{border-left:2px solid var(--ochre);}
  .steps-rail li.done{border-left:2px solid var(--forest);}
  .steps-rail .num{ font-family:'Fraunces', serif; font-size:0.85rem; color:var(--ink-soft); min-width:1.2rem; }
  .steps-rail li.active .num{color:var(--ochre-dark); font-weight:600;}
  .steps-rail li.done .num{color:var(--forest);}
  .steps-rail .label{font-size:0.92rem;}
  .steps-rail li.locked{cursor:not-allowed; opacity:0.5;}
  .steps-rail li.done .label::after{content:" ✓"; color:var(--forest); font-size:0.8rem;}
  .panel{ background:#fff; border:1px solid var(--line); border-radius:4px; padding:2rem; }
  .panel h2{ font-family:'Fraunces', serif; font-weight:500; font-size:1.35rem; margin:0 0 0.35rem; }
  .panel .step-hint{ color:var(--ink-soft); font-size:0.9rem; margin:0 0 1.75rem; }
  .field{margin-bottom:1.4rem;}
  .field label{ display:block; font-size:0.85rem; font-weight:600; margin-bottom:0.4rem; }
  .field .field-hint{ font-size:0.78rem; color:var(--ink-soft); margin:0.25rem 0 0; }
  input[type=text], textarea, select{ width:100%; font-family:'Source Sans 3', sans-serif; font-size:0.95rem; padding:0.6rem 0.7rem; border:1px solid var(--line); border-radius:3px; background:var(--parchment); color:var(--ink); }
  input[type=text]:focus, textarea:focus, select:focus{ outline:none; border-color:var(--ochre); background:#fff; }
  textarea{resize:vertical; min-height:80px;}
  .error-text{ display:none; color:var(--danger); font-size:0.8rem; margin-top:0.35rem; }
  .field.invalid input, .field.invalid textarea, .field.invalid select{border-color:var(--danger);}
  .field.invalid .error-text{display:block;}
  .module-card, .lesson-card{ border:1px solid var(--line); border-radius:3px; padding:1rem 1.1rem; margin-bottom:0.9rem; background:var(--parchment); }
  .remove-btn{ background:none; border:none; color:var(--ink-soft); font-size:0.78rem; cursor:pointer; text-decoration:underline; padding:0.2rem 0; white-space:nowrap; }
  .remove-btn:hover{color:var(--danger);}
  .add-btn{ background:transparent; border:1px dashed var(--line); color:var(--forest); font-size:0.88rem; padding:0.55rem 0.9rem; border-radius:3px; cursor:pointer; font-weight:600; }
  .add-btn:hover{border-color:var(--forest); background:var(--forest-light);}
  .actions-row{ display:flex; justify-content:space-between; align-items:center; margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--line); }
  .btn{ font-family:'Source Sans 3', sans-serif; font-size:0.92rem; font-weight:600; padding:0.65rem 1.3rem; border-radius:3px; cursor:pointer; border:1px solid var(--ink); }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn[disabled]{opacity:0.5; cursor:not-allowed;}
  .review-block{margin-bottom:1.5rem;}
  .review-block h3{ font-family:'Fraunces', serif; font-size:1.05rem; font-weight:600; margin:0 0 0.6rem; color:var(--ochre-dark); }
  .review-module{margin-bottom:1rem; padding-left:0.9rem; border-left:2px solid var(--line);}
  .review-module h4{margin:0 0 0.3rem; font-size:0.95rem;}
  .review-module ul{margin:0.2rem 0 0; padding-left:1.1rem; font-size:0.88rem; color:var(--ink-soft);}
  .banner{ background:var(--forest-light); border:1px solid var(--forest); border-radius:3px; padding:0.9rem 1.1rem; font-size:0.88rem; color:var(--forest); margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
  .banner.demo{ background:var(--parchment-2); border:1px solid var(--ochre); color:var(--ink); }
  .banner.demo strong{color:var(--ochre-dark);}
  .banner .btn-inline{ background:var(--ochre); border:none; color:#fff; padding:0.4rem 0.8rem; border-radius:3px; font-size:0.8rem; font-weight:600; cursor:pointer; white-space:nowrap; }
  .account-bar{ display:flex; justify-content:flex-end; align-items:center; gap:0.75rem; font-size:0.82rem; color:var(--ink-soft); margin-bottom:0.9rem; }
  .account-bar button{ background:none; border:1px solid var(--line); color:var(--ink); padding:0.3rem 0.7rem; border-radius:3px; font-size:0.78rem; cursor:pointer; }
  .account-bar .account-link{ background:none; border:1px solid var(--line); color:var(--ink); padding:0.3rem 0.7rem; border-radius:3px; font-size:0.78rem; cursor:pointer; text-decoration:none; display:inline-block; }
  .lock-note{ font-size:0.8rem; color:var(--ochre-dark); margin-top:0.6rem; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(27,42,68,0.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:1.5rem; }
  .modal-box{ background:#fff; border-radius:5px; max-width:460px; width:100%; padding:2rem; }
  .modal-box h3{ font-family:'Fraunces', serif; font-weight:600; font-size:1.2rem; margin:0 0 0.6rem; }
  .modal-box p{ font-size:0.9rem; color:var(--ink-soft); margin:0 0 1.3rem; line-height:1.5; }
  .modal-actions{ display:flex; flex-direction:column; gap:0.6rem; margin-top:1.2rem; }
  .modal-actions .btn{width:100%;}
  .modal-close{ background:none; border:none; color:var(--ink-soft); font-size:0.8rem; text-decoration:underline; cursor:pointer; margin-top:0.4rem; }
  .program-outline{ border:1px solid var(--line); border-radius:3px; padding:0.5rem 1rem; margin-bottom:1rem; background:var(--parchment); }
  .program-outline h4{ font-family:'Fraunces', serif; font-size:0.98rem; margin:0.8rem 0 0.3rem; }
  .program-outline ul{ margin:0 0 0.4rem; padding-left:1.2rem; font-size:0.9rem; }
  .program-outline input[type=text]{ margin:0.15rem 0; }
  .spinner-box{ text-align:center; padding:2.5rem 1rem; color:var(--ink-soft); font-size:0.92rem; }
  .lesson-content-box{ border:1px solid var(--line); border-radius:3px; padding:1rem 1.1rem; margin-bottom:0.9rem; background:var(--parchment); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">DeCastro <span>| Criador de Curso</span></div>
    <div class="resume-note" id="autosaveNote"></div>
  </header>
  <div class="account-bar" id="accountBar"></div>
  <div id="resumeBanner"></div>
  <div id="demoBanner"></div>
  <h1 class="page-title" id="pageTitle">Monte seu curso com a ajuda da IA</h1>
  <p class="page-sub">Você informa o essencial, a IA propõe o programa e já escreve o conteúdo — você revisa e ajusta o que quiser, no seu ritmo, em qualquer momento.</p>
  <div class="layout">
    <ul class="steps-rail" id="stepsRail"></ul>
    <div class="panel" id="panelContent"></div>
  </div>
</div>
<div id="modalRoot"></div>

<script>
const CHECKOUT_URL = 'https://invoice.infinitepay.io/plans/decastro247/VydK18LDsR';
const STORAGE_KEY = 'decastro_criador_curso_v2';
const DEMO_MODULE_COUNT = 1;
const DEMO_LESSONS_PER_MODULE = 2;

const STEP_META = [
  {id:1, label:'Dados do curso'},
  {id:2, label:'Programa sugerido'},
  {id:3, label:'Conteúdo e edição'},
  {id:4, label:'Avaliação e certificado'},
  {id:5, label:'Revisão final'}
];

function blankState(){
  return {
    currentStep: 1,
    maxStepReached: 1,
    courseId: null,
    course: { title:'', hours:'', level:'basico', price:'' },
    program: { accepted:false, attempts:0, modules:[] },
    modules: [],
    finalAssessment: { title:'', description:'', questionCount:'10', passScore:'70' },
    certificate: { enabled:true, title:'', text:'' }
  };
}

function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
let state = loadState();
let cameFromResume = !!state;
if(!state) state = blankState();

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const note = document.getElementById('autosaveNote');
  note.textContent = 'Salvo agora';
  clearTimeout(saveState._t);
  saveState._t = setTimeout(()=>{ note.textContent=''; }, 1800);
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- conta / assinatura (via Worker real) ---------- */
let currentUser = null; // { authenticated, name, email, subscriber } — vem do /api/me

async function refreshUser(){
  try{
    currentUser = await fetchWorker('/api/me', { method:'GET' });
  }catch(e){
    currentUser = { authenticated:false };
  }
}
function isAuthenticated(){ return !!(currentUser && currentUser.authenticated); }
function isSubscriber(){ return !!(currentUser && currentUser.subscriber); }
function hasFullAccess(){ return isSubscriber(); }

function openPaymentSettingsModal(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>Recebimento de pagamentos</h3>
        <p>Para cobrar matrícula dos seus alunos, informe seu handle da InfinitePay (o mesmo que aparece nos seus links de pagamento, ex: "joaosilva"). O dinheiro das matrículas cai direto na sua conta — nunca passa pela DeCastro.</p>
        <div class="field">
          <label for="pay-handle">Handle da InfinitePay</label>
          <input type="text" id="pay-handle" placeholder="seuhandle">
        </div>
        <p class="error-text" id="payErr" style="display:none;"></p>
        <p id="paySaved" style="display:none; color:var(--forest); font-size:0.85rem;">Salvo!</p>
        <div class="modal-actions"><button class="btn btn-primary" id="doSavePay">Salvar</button></div>
        <button class="modal-close" id="closePay">Fechar</button>
      </div>
    </div>`;
  fetchWorker('/api/payment-settings', { method:'GET' }).then(s=>{
    if(s.handle) document.getElementById('pay-handle').value = s.handle;
  }).catch(()=>{});
  document.getElementById('doSavePay').onclick = async ()=>{
    const handle = document.getElementById('pay-handle').value.trim();
    try{
      await fetchWorker('/api/payment-settings', { method:'POST', body:{ provider:'infinitepay', handle } });
      document.getElementById('paySaved').style.display = 'block';
      document.getElementById('payErr').style.display = 'none';
    }catch(err){
      document.getElementById('payErr').style.display = 'block';
      document.getElementById('payErr').textContent = err.message;
    }
  };
  document.getElementById('closePay').onclick = closeModal;
}

function renderAccountBar(){
  const bar = document.getElementById('accountBar');
  const newCourseBtn = `<button id="newCourseBtn">+ Novo curso</button>`;
  const myCoursesBtn = `<button id="myCoursesBtn">📚 Meus cursos</button>`;
  const paymentsBtn = `<button id="paymentsBtn">💳 Pagamentos</button>`;
  if(isAuthenticated()){
    const nearExpiry = currentUser.subscriber && currentUser.daysLeft !== null && currentUser.daysLeft <= 5;
    bar.innerHTML = `<span>Olá, ${escapeHtml(currentUser.name)}${currentUser.subscriber ? ' <strong style="color:var(--forest);">· assinante</strong>' : ' · conta gratuita'}</span>
      <a class="account-link" href="portal.html">🎓 Portal</a>
      ${myCoursesBtn}
      ${newCourseBtn}
      ${paymentsBtn}
      ${!currentUser.subscriber ? '<button id="wantSubBtn">Assinar</button>' : ''}
      ${nearExpiry ? `<button id="renewBtn" style="border-color:var(--ochre); color:var(--ochre-dark);">Renovar (${currentUser.daysLeft}d)</button>` : ''}
      <button id="logoutBtn">Sair</button>`;
    document.getElementById('logoutBtn').onclick = async ()=>{
      await fetchWorker('/api/logout', { method:'POST', body:{} }).catch(()=>{});
      await refreshUser();
      appView = 'wizard';
      render();
    };
    document.getElementById('myCoursesBtn').onclick = ()=>{ appView = 'dashboard'; render(); };
    document.getElementById('paymentsBtn').onclick = openPaymentSettingsModal;
    if(!currentUser.subscriber){
      document.getElementById('wantSubBtn').onclick = ()=>openSubscribeModal('demo_scale');
    }
    if(nearExpiry){
      document.getElementById('renewBtn').onclick = ()=>openSubscribeModal('renew');
    }
  } else {
    bar.innerHTML = `${newCourseBtn} <button id="loginBtnTop">Entrar</button> <button id="signupBtnTop">Criar conta</button>`;
    document.getElementById('signupBtnTop').onclick = openSignupModal;
    document.getElementById('loginBtnTop').onclick = openLoginModal;
  }
  document.getElementById('newCourseBtn').onclick = ()=>{
    if(state.currentStep > 1 && !confirm('Isso limpa o curso que você está editando nesta tela (o que já foi salvo no servidor continua lá) e começa um novo do zero. Continuar?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = blankState();
    cameFromResume = false;
    appView = 'wizard';
    render();
  };
}

/* ---------- modais ---------- */
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function formatBRL(cents){
  return (cents/100).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
let pricingInfo = null;
async function loadPricing(){
  if(pricingInfo) return pricingInfo;
  try{ pricingInfo = await fetchWorker('/api/pricing', { method:'GET' }); }
  catch(e){ pricingInfo = { priceCents:5400, fullPriceCents:5400 }; }
  return pricingInfo;
}

function openSubscribeModal(reason){
  reason = reason || 'demo_scale';
  const messages = {
    demo_scale: {
      title: 'Modo demonstração',
      body: 'No modo demonstração, a IA sugere um curso pequeno (1 módulo, 2 aulas), só para você experimentar. Assine o Criador de Cursos para gerar cursos completos, proporcionais à carga horária e ao nível que você escolher.'
    },
    edit_limit: {
      title: 'Adicionar mais módulos e aulas é para assinantes',
      body: 'No modo demonstração você pode editar o que a IA já gerou, mas adicionar módulos ou aulas além do programa demonstrativo é um recurso do plano pago.'
    },
    renew: {
      title: 'Sua assinatura está perto de vencer',
      body: 'Renove agora para não perder o acesso aos recursos completos. É rápido — o mesmo checkout de sempre, e sua validade é renovada por mais 30 dias a partir do pagamento.'
    }
  };
  const msg = messages[reason];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>${msg.title}</h3>
        <p>${msg.body}</p>
        <p id="pricingLine" style="font-size:0.95rem; margin-top:-0.6rem;">Carregando preço...</p>
        <div class="modal-actions">
          <button class="btn btn-primary" id="goCheckout">Quero assinar</button>
          ${!isAuthenticated() ? '<button class="btn btn-ghost" id="goSignup">Criar conta gratuita primeiro</button>' : ''}
        </div>
        <button class="modal-close" id="closeSubscribe">Continuar no modo demonstração</button>
      </div>
    </div>`;
  loadPricing().then(pricing=>{
    const line = document.getElementById('pricingLine');
    if(!line) return; // modal pode ter sido fechado antes da resposta chegar
    if(pricing.fullPriceCents > pricing.priceCents){
      line.innerHTML = `<span style="text-decoration:line-through; color:var(--ink-soft);">De R$ ${formatBRL(pricing.fullPriceCents)}</span> <strong style="color:var(--ochre-dark);">por R$ ${formatBRL(pricing.priceCents)}</strong>`;
    } else {
      line.innerHTML = `<strong style="color:var(--ochre-dark);">R$ ${formatBRL(pricing.priceCents)}</strong>`;
    }
  });
  document.getElementById('goCheckout').onclick = async ()=>{
    if(!isAuthenticated()){ openSignupModal(); return; }
    const btn = document.getElementById('goCheckout');
    btn.disabled = true; btn.textContent = 'Gerando checkout...';
    try{
      const result = await fetchWorker('/api/create-checkout', { method:'POST', body:{} });
      window.location.href = result.url;
    }catch(err){
      btn.disabled = false; btn.textContent = 'Quero assinar';
      alert('Não foi possível abrir o checkout agora: ' + err.message);
    }
  };
  if(!isAuthenticated()) document.getElementById('goSignup').onclick = openSignupModal;
  document.getElementById('closeSubscribe').onclick = closeModal;
}

function openSignupModal(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>Criar conta gratuita</h3>
        <p>Sua conta guarda o curso que você já começou. A assinatura continua sendo necessária para gerar cursos completos (além do tamanho de demonstração).</p>
        <div class="field"><label for="su-name">Nome</label><input type="text" id="su-name"></div>
        <div class="field"><label for="su-email">E-mail</label><input type="text" id="su-email"></div>
        <div class="field" style="margin-bottom:0;"><label for="su-pass">Senha</label><input type="password" id="su-pass"></div>
        <p class="error-text" id="signupError" style="display:none;"></p>
        <div class="modal-actions"><button class="btn btn-primary" id="doSignup">Criar conta e continuar</button></div>
        <button class="modal-close" id="switchToLogin">Já tem conta? Entrar</button>
        <button class="modal-close" id="closeSignup">Cancelar</button>
      </div>
    </div>`;
  document.getElementById('doSignup').onclick = async ()=>{
    const name = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-pass').value;
    if(!name || !email || !password) return;
    const btn = document.getElementById('doSignup');
    btn.disabled = true; btn.textContent = 'Criando conta...';
    try{
      await fetchWorker('/api/signup', { method:'POST', body:{ name, email, password } });
      await refreshUser();
      closeModal();
      render();
    }catch(err){
      const errEl = document.getElementById('signupError');
      errEl.style.display = 'block';
      errEl.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Criar conta e continuar';
    }
  };
  document.getElementById('switchToLogin').onclick = openLoginModal;
  document.getElementById('closeSignup').onclick = closeModal;
}

function openLoginModal(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>Entrar</h3>
        <div class="field"><label for="li-email">E-mail</label><input type="text" id="li-email"></div>
        <div class="field" style="margin-bottom:0;"><label for="li-pass">Senha</label><input type="password" id="li-pass"></div>
        <p class="error-text" id="loginError" style="display:none;"></p>
        <div class="modal-actions"><button class="btn btn-primary" id="doLogin">Entrar</button></div>
        <button class="modal-close" id="switchToSignup">Ainda não tem conta? Criar conta</button>
        <button class="modal-close" id="closeLogin">Cancelar</button>
      </div>
    </div>`;
  document.getElementById('doLogin').onclick = async ()=>{
    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-pass').value;
    if(!email || !password) return;
    const btn = document.getElementById('doLogin');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try{
      await fetchWorker('/api/login', { method:'POST', body:{ email, password } });
      await refreshUser();
      appView = cameFromResume ? 'wizard' : 'dashboard';
      closeModal();
      render();
    }catch(err){
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'block';
      errEl.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
  document.getElementById('switchToSignup').onclick = openSignupModal;
  document.getElementById('closeLogin').onclick = closeModal;
}

/* ---------- banners ---------- */
function renderResumeBanner(){
  const el = document.getElementById('resumeBanner');
  if(cameFromResume && state.currentStep > 1){
    el.innerHTML = `<div class="banner">
      <span>Encontramos um curso em andamento, parado na etapa "${STEP_META[state.currentStep-1].label}".</span>
      <button id="dismissResume">Continuar de onde parei</button>
    </div>`;
    document.getElementById('dismissResume').onclick = ()=>{ el.innerHTML=''; };
  } else { el.innerHTML = ''; }
}

function renderDemoBanner(){
  const el = document.getElementById('demoBanner');
  if(hasFullAccess()){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="banner demo">
    <span><strong>Modo demonstração:</strong> a IA sugere e gera um curso pequeno (1 módulo, 2 aulas) para você experimentar. Você revisa e ajusta tudo — assine para gerar cursos completos.</span>
    <button class="btn-inline" id="demoSubscribeBtn">Assinar</button>
  </div>`;
  document.getElementById('demoSubscribeBtn').onclick = ()=>openSubscribeModal('demo_scale');
}

/* ---------- trilha ---------- */
function renderRail(){
  const rail = document.getElementById('stepsRail');
  rail.innerHTML = '';
  const lastStep = STEP_META.length;
  STEP_META.forEach(step=>{
    const li = document.createElement('li');
    const locked = step.id > state.maxStepReached;
    li.className = (step.id === state.currentStep ? 'active ' : '') +
                    (step.id < state.currentStep || (step.id===lastStep && state.maxStepReached>=lastStep && state.currentStep!==lastStep) ? 'done ' : '') +
                    (locked ? 'locked' : '');
    li.innerHTML = `<span class="num">${String(step.id).padStart(2,'0')}</span><span class="label">${step.label}</span>`;
    if(!locked) li.onclick = ()=>{ state.currentStep = step.id; saveState(); render(); };
    rail.appendChild(li);
  });
}

/* ---------- ações padrão ---------- */
function renderActions({onNext, hideNext, nextLabel, loadingLabel}={}){
  const p = document.getElementById('panelContent');
  const row = document.createElement('div');
  row.className = 'actions-row';
  const left = document.createElement('div');
  if(state.currentStep > 1){
    const backBtn = document.createElement('button');
    backBtn.className = 'btn btn-ghost';
    backBtn.textContent = 'Voltar';
    backBtn.onclick = ()=>{ state.currentStep -= 1; render(); };
    left.appendChild(backBtn);
  }
  row.appendChild(left);
  if(!hideNext){
    const right = document.createElement('div');
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-primary';
    const originalLabel = nextLabel || 'Salvar e continuar';
    nextBtn.textContent = originalLabel;
    nextBtn.onclick = async ()=>{
      nextBtn.disabled = true;
      nextBtn.textContent = loadingLabel || 'Processando...';
      try{
        const ok = onNext ? await onNext() : true;
        if(ok){
          const lastStep = STEP_META.length;
          state.currentStep = Math.min(state.currentStep + 1, lastStep);
          state.maxStepReached = Math.max(state.maxStepReached, state.currentStep);
          render();
        } else {
          nextBtn.disabled = false;
          nextBtn.textContent = originalLabel;
        }
      } catch(err){
        nextBtn.disabled = false;
        nextBtn.textContent = originalLabel;
        showActionError(err.message);
      }
    };
    right.appendChild(nextBtn);
    row.appendChild(right);
  }
  p.appendChild(row);
}
function showActionError(msg){
  let el = document.getElementById('actionErrorNote');
  if(!el){
    el = document.createElement('p');
    el.id = 'actionErrorNote';
    el.className = 'error-text';
    el.style.display = 'block';
    document.querySelector('.actions-row').before(el);
  }
  el.textContent = 'Não foi possível falar com o servidor de IA (' + msg + ') — usando um exemplo simulado.';
}

/* ---------- conexão com o Worker real ---------- */
const WORKER_BASE_URL = 'https://criador-curso-decastro.intelectus247.workers.dev';

async function fetchWorker(path, { method, body } = {}){
  if(!WORKER_BASE_URL){
    throw new Error('WORKER_BASE_URL não configurada');
  }
  const opts = {
    method: method || 'POST',
    credentials: 'include',
    headers: { 'content-type': 'application/json' }
  };
  if(body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(WORKER_BASE_URL + path, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('resposta ' + res.status));
  return data;
}

/* ---------- Etapa 2: programa sugerido ---------- */
async function generateProgramSuggestion(){
  const demo = !hasFullAccess();
  try{
    const result = await fetchWorker('/api/suggest-program', { method:'POST', body:{
      title: state.course.title, hours: state.course.hours, level: state.course.level
    }});
    const modulesWithIds = result.modules.map(m=>({
      id: uid(),
      title: m.title,
      lessons: m.lessons.map(l=>({ id: uid(), title: l.title }))
    }));
    state.program = { accepted:false, attempts:(state.program.attempts||0)+1, modules: modulesWithIds, source:'ia' };
    return;
  }catch(err){
    // Sem Worker configurado ou fora do ar: usa a simulação local, sem travar a experiência.
    buildLocalProgramSuggestion(demo);
    state.program.source = 'simulado';
  }
}

function buildLocalProgramSuggestion(demo){
  let moduleCount, lessonsPerModule;
  if(demo){
    moduleCount = DEMO_MODULE_COUNT;
    lessonsPerModule = DEMO_LESSONS_PER_MODULE;
  } else {
    const hours = parseInt(state.course.hours) || 10;
    moduleCount = Math.min(8, Math.max(3, Math.round(hours/4)));
    lessonsPerModule = state.course.level === 'avancado' ? 4 : state.course.level === 'intermediario' ? 3 : 2;
  }
  const modules = [];
  for(let i=0;i<moduleCount;i++){
    const modTitle = `Módulo ${i+1}: ${state.course.title || 'tema do curso'} — parte ${i+1}`;
    const lessons = [];
    for(let j=0;j<lessonsPerModule;j++){
      lessons.push({ id:uid(), title:`Aula ${j+1} — ${modTitle}` });
    }
    modules.push({ id:uid(), title:modTitle, lessons });
  }
  state.program = { accepted:false, attempts:(state.program.attempts||0)+1, modules };
}

/* ---------- geração do conteúdo completo ---------- */
async function generateFullContent(){
  const demo = !hasFullAccess();
  try{
    const result = await fetchWorker('/api/generate-course-content', { method:'POST', body:{
      courseTitle: state.course.title,
      level: state.course.level,
      program: {
        modules: state.program.modules.map(m=>({
          title: m.title,
          lessons: m.lessons.map(l=>({ title: l.title }))
        }))
      }
    }});
    state.modules = result.modules.map((m, mi)=>({
      id: state.program.modules[mi].id,
      title: m.title,
      description: m.description,
      lessons: m.lessons.map((l, li)=>({
        id: state.program.modules[mi].lessons[li].id,
        title: l.title, type:'video', duration:10,
        content: l.content, videoUrl: ''
      })),
      activity: m.activity
    }));
    state.contentSource = 'ia';
  }catch(err){
    buildLocalFullContent();
    state.contentSource = 'simulado';
  }
  state.program.accepted = true;

function buildLocalFullContent(){
  const levelLabel = {basico:'básico', intermediario:'intermediário', avancado:'avançado'}[state.course.level] || 'básico';
  state.modules = state.program.modules.map(m=>({
    id: m.id,

    description: `Módulo de nível ${levelLabel} sobre "${m.title}".`,
    lessons: m.lessons.map(l=>({
      id: l.id, title: l.title, type:'video', duration:10,
      content: `Conteúdo simulado para a aula "${l.title}" — conecte o Worker para gerar conteúdo real. Revise e ajuste como quiser.`,
      videoUrl: ''
    })),
    activity: {

      instructions: `Atividade simulada para encerrar o módulo "${m.title}" — conecte o Worker para gerar a versão real.`

    <div class="review-block">
      <h3>Certificado</h3>
      <p style="font-size:0.88rem;">${cert.enabled ? (escapeHtml(cert.title) || '(sem título definido)') : 'Não será emitido'}</p>
    </div>`;
  renderActions({ hideNext: true });
  const actionsRow = document.querySelector('.actions-row');
  const finishBtn = document.createElement('button');
  finishBtn.className = 'btn btn-primary';
  finishBtn.textContent = 'Marcar curso como concluído';
  finishBtn.onclick = async ()=>{
    saveState();
    finishBtn.disabled = true;
    finishBtn.textContent = 'Salvando...';
    await syncCourseToServer();
    finishBtn.disabled = false;
    finishBtn.textContent = 'Marcar curso como concluído';
    alert('Curso salvo no servidor. A exportação para DOCX entra numa próxima etapa.');
  };
  actionsRow.appendChild(finishBtn);

  if(state.courseId){
    const pdfBtn = document.createElement('button');
    pdfBtn.className = 'btn btn-ghost';
    pdfBtn.textContent = 'Baixar apostila em PDF';
    pdfBtn.onclick = ()=>{ window.open(WORKER_BASE_URL + '/api/apostila?courseId=' + encodeURIComponent(state.courseId), '_blank'); };
    actionsRow.appendChild(pdfBtn);
  }
}

/* ---------- Meus Cursos (painel do professor logado) ---------- */
let appView = 'wizard'; // 'dashboard' | 'wizard'

async function renderDashboardScreen(){
  const rail = document.getElementById('stepsRail');
  if(rail) rail.innerHTML = '';
  document.getElementById('resumeBanner').innerHTML = '';
  document.getElementById('demoBanner').innerHTML = '';
  const p = document.getElementById('panelContent');
  p.innerHTML = '<p style="color:var(--ink-soft);">Carregando seus cursos...</p>';

  let courses = [];
  let loadError = null;
  try{
    const result = await fetchWorker('/api/my-courses', { method:'GET' });
    courses = result.courses || [];
  }catch(err){
    loadError = err.message;
  }

  let html = `<h2>Meus cursos</h2><p class="step-hint">Os cursos que você já criou. Edite qualquer um, ou comece um novo do zero. Publique os que quiser deixar disponíveis na sua vitrine pública.</p>`;
  if(loadError){
    html += `<p class="error-text" style="display:block;">Não foi possível carregar seus cursos (${escapeHtml(loadError)}).</p>`;
  } else if(courses.length === 0){
    html += `<p style="color:var(--ink-soft); font-size:0.9rem;">Você ainda não criou nenhum curso.</p>`;
  } else {
    html += `<div style="display:flex; flex-direction:column; gap:0.8rem; margin-bottom:1.5rem;">`;
    courses.forEach(c=>{
      const published = c.status === 'published';
      html += `<div class="module-card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.6rem;">
        <div>
          <strong>${escapeHtml(c.title || '(sem título)')}</strong>
          <p style="font-size:0.8rem; color:var(--ink-soft); margin:0.2rem 0 0;">${escapeHtml(c.hours || '-')}h · ${escapeHtml(c.level || '-')} · ${published ? '<span style="color:var(--forest);">Publicado</span>' : 'Rascunho (não visível na vitrine)'}</p>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn btn-ghost" data-publish="${c.id}" data-current="${published ? '1':'0'}">${published ? 'Despublicar' : 'Publicar'}</button>
          <button class="btn btn-ghost" data-cid="${c.id}">Editar</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
    <button class="add-btn" id="newCourseFromDashboard" type="button">+ Criar novo curso</button>
    <button class="add-btn" id="showcaseSettingsBtn" type="button">🔗 Minha vitrine pública</button>
  </div>`;
  p.innerHTML = html;

  p.querySelectorAll('button[data-cid]').forEach(btn=>{
    btn.onclick = ()=> loadCourseForEdit(btn.dataset.cid);
  });
  p.querySelectorAll('button[data-publish]').forEach(btn=>{
    btn.onclick = async ()=>{
      const publish = btn.dataset.current !== '1';
      btn.disabled = true; btn.textContent = 'Salvando...';
      try{
        await fetchWorker('/api/publish-course', { method:'POST', body:{ courseId: btn.dataset.publish, publish } });
        renderDashboardScreen();
      }catch(err){
        alert('Não foi possível atualizar: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  document.getElementById('newCourseFromDashboard').onclick = ()=>{
    localStorage.removeItem(STORAGE_KEY);
    state = blankState();
    cameFromResume = false;
    appView = 'wizard';
    render();
  };
  document.getElementById('showcaseSettingsBtn').onclick = openShowcaseSettingsModal;
}

function openShowcaseSettingsModal(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>Minha vitrine pública</h3>
        <p>Escolha um apelido para sua página pública de cursos. Os alunos acessam por esse link e veem só os cursos que você marcou como "Publicado".</p>
        <div class="field">
          <label for="slug-input">Apelido (sem espaços)</label>
          <input type="text" id="slug-input" placeholder="seuapelido">
        </div>
        <p id="slugLink" style="font-size:0.85rem; color:var(--ink-soft); word-break:break-all;"></p>
        <p class="error-text" id="slugErr" style="display:none;"></p>
        <div class="modal-actions"><button class="btn btn-primary" id="doSaveSlug">Salvar</button></div>
        <button class="modal-close" id="closeSlug">Fechar</button>
      </div>
    </div>`;
  const linkBase = window.location.origin + window.location.pathname.replace('criador-de-curso.html', 'vitrine.html');
  function updateLinkPreview(slug){
    document.getElementById('slugLink').textContent = slug ? `Seu link: ${linkBase}?p=${slug}` : '';
  }
  fetchWorker('/api/public-profile', { method:'GET' }).then(s=>{
    if(s.slug){ document.getElementById('slug-input').value = s.slug; updateLinkPreview(s.slug); }
  }).catch(()=>{});
  document.getElementById('doSaveSlug').onclick = async ()=>{
    const slug = document.getElementById('slug-input').value.trim();
    try{
      const result = await fetchWorker('/api/public-profile', { method:'POST', body:{ slug } });
      updateLinkPreview(result.slug);
      document.getElementById('slugErr').style.display = 'none';
    }catch(err){
      document.getElementById('slugErr').style.display = 'block';
      document.getElementById('slugErr').textContent = err.message;
    }
  };
  document.getElementById('closeSlug').onclick = closeModal;
}

async function loadCourseForEdit(courseId){
  const p = document.getElementById('panelContent');
  p.innerHTML = '<p style="color:var(--ink-soft);">Carregando curso...</p>';
  try{
    const data = await fetchWorker('/api/load-course?id=' + encodeURIComponent(courseId), { method:'GET' });
    const fresh = blankState();
    fresh.courseId = courseId;
    fresh.course = data.course;
    fresh.course.price = data.course.priceCents ? String(data.course.priceCents/100) : '';
    fresh.modules = data.modules;
    fresh.finalAssessment = (data.finalAssessment && data.finalAssessment.title) ? data.finalAssessment : fresh.finalAssessment;
    fresh.certificate = (data.certificate && Object.keys(data.certificate).length) ? data.certificate : fresh.certificate;
    fresh.program = {
      accepted: true, attempts: 0,
      modules: data.modules.map(m=>({ id:m.id, title:m.title, lessons:m.lessons.map(l=>({id:l.id,title:l.title})) }))
    };
    fresh.currentStep = 3;
    fresh.maxStepReached = 5;
    state = fresh;
    cameFromResume = false;
    appView = 'wizard';
    saveState();
    render();
  }catch(err){
    p.innerHTML = `<p class="error-text" style="display:block;">Não foi possível carregar o curso (${escapeHtml(err.message)}).</p>
      <button class="btn btn-ghost" id="backToDashboard">Voltar</button>`;
    document.getElementById('backToDashboard').onclick = ()=>{ appView='dashboard'; render(); };
  }
}

/* ---------- render principal ---------- */
function render(){
  closeModal();
  renderAccountBar();
  if(!isAuthenticated()) appView = 'wizard';
  if(appView === 'dashboard'){
    renderDashboardScreen();
    return;
  }
  renderResumeBanner();
  renderDemoBanner();
  renderRail();
  const renderers = {1:renderStep1, 2:renderStep2, 3:renderStep3, 4:renderStep4, 5:renderStep5};
  renderers[state.currentStep]();
}
async function init(){
  await refreshUser();
  appView = (isAuthenticated() && !cameFromResume) ? 'dashboard' : 'wizard';
  render();
}
init();
</script>
